<!DOCTYPE html>
<html lang="en" xml:lang="en">

<head>
   <meta charset="utf-8">
   <title>Join Party</title>
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" type="text/css" media="screen" href="assets/css/style-min.css">
   <script src="assets/js/join-min.js" defer></script>
</head>

<body>
   <!-- LOADING ICON -->
   <div class="loading-container hide" id="loading-icon" aria-live="polite">
      <svg class="loading-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-label="Loading">
         <path
            d="M304 48a48 48 0 1 0 -96 0 48 48 0 1 0 96 0zm0 416a48 48 0 1 0 -96 0 48 48 0 1 0 96 0zM48 304a48 48 0 1 0 0-96 48 48 0 1 0 0 96zm464-48a48 48 0 1 0 -96 0 48 48 0 1 0 96 0zM142.9 437A48 48 0 1 0 75 369.1 48 48 0 1 0 142.9 437zm0-294.2A48 48 0 1 0 75 75a48 48 0 1 0 67.9 67.9zM369.1 437A48 48 0 1 0 437 369.1 48 48 0 1 0 369.1 437z" />
      </svg>
   </div>
   <!-- HEADER -->
   <header>
      <h1 class="heading" aria-describedby="page-description">Join Party</h1>
      <p class="description" id="page-description">Join a party by entering the party code</p>
   </header>
   <!-- MAIN -->
   <main>
      <form id="join-form" class="form-container" aria-label="enter join code">
         <p class="input-error hide" id="no-party-found-error" role="alert">No party exists with that code</p>
         <div class="field-with-actions">
            <div class="field-body secondary">
               <input class="field-value align-text-center" type="text" name="party-code" placeholder="Enter party code" id="party-code"
                  aria-label="Party Code" aria-describedby="no-party-found-error" maxlength="6" minlength="1">
               <button type="button" class="field-action-function click-to-paste hide" data-paste-target="party-code"
                  aria-label="Search">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                     <path
                        d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1z" />
                     <path
                        d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0z" />
                  </svg>
               </button>
            </div>
         </div>
         <div class="btn-container">
            <button class="btn btn-primary" type="submit" aria-label="Join">Join</button>
            <a class="btn" href="./" aria-label="Go back">Go back</a>
         </div>
      </form>
   </main>
   <!-- FOOTER -->
   <footer>
      <p>Developed by <a href="https://acegoal07.dev" rel="noopener" target="_blank">acegoal07</a> powered by <a
            href="https://developer.spotify.com/documentation/web-api/" rel="noopener" target="_blank">Spotify</a>
      </p>
   </footer>
</body>

</html>

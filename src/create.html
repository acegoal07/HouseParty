<!DOCTYPE html>
<html lang="en" xml:lang="en">

<head>
   <meta charset="utf-8">
   <title>Create Party</title>
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" type="text/css" media="screen" href="assets/css/style-min.css">
   <script src="assets/js/create-min.js" defer></script>
</head>

<body>
   <!-- LOADING ICON -->
   <div class="loading-container" id="loading-icon" aria-live="polite">
      <svg class="loading-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-label="Loading">
         <path
            d="M304 48a48 48 0 1 0 -96 0 48 48 0 1 0 96 0zm0 416a48 48 0 1 0 -96 0 48 48 0 1 0 96 0zM48 304a48 48 0 1 0 0-96 48 48 0 1 0 0 96zm464-48a48 48 0 1 0 -96 0 48 48 0 1 0 96 0zM142.9 437A48 48 0 1 0 75 369.1 48 48 0 1 0 142.9 437zm0-294.2A48 48 0 1 0 75 75a48 48 0 1 0 67.9 67.9zM369.1 437A48 48 0 1 0 437 369.1 48 48 0 1 0 369.1 437z" />
      </svg>
   </div>
   <!-- HEADER -->
   <header>
      <h1 class="heading" aria-describedby="page-description">Create Party</h1>
      <p class="description" id="page-description">Set the settings for the party you want to create</p>
   </header>
   <!-- MAIN -->
   <main>
      <form id="create-party" class="form-container">
         <div class="input-label-container">
            <label class="input-label" for="party-duration">Party Duration (hours)</label>
            <input class="short-input" id="party-duration" type="number" name="party-duration" title="Party Duration" minlength="1"
               maxlength="2" min="1" max="24" required value="4" />            
         </div>
         <div class="checkbox-group">
            <div class="custom-checkbox-container">
               <input type="checkbox" id="explicit-checkbox" name="explicitCheckbox">
               <label for="explicit-checkbox">Allow explicit content</label>
            </div>
            <div class="custom-checkbox-container">
               <input type="checkbox" id="duplicate-blocker-checkbox" name="duplicateCheckbox">
               <label for="duplicate-blocker-checkbox">Block duplicate songs</label>
            </div>
         </div>
         <div class="btn-container">
            <button class="btn btn-primary" type="submit" aria-label="Create Party">Create Party</button>
            <a class="btn" href="./" aria-label="Go Back">Go Back</a>
         </div>
      </form>
   </main>
   <!-- FOOTER -->
   <footer>
      <p>Developed by <a href="https://acegoal07.dev" rel="noopener" target="_blank">acegoal07</a> powered by <a
            href="https://developer.spotify.com/documentation/web-api/" rel="noopener" target="_blank">Spotify</a>
      </p>
   </footer>
</body>

</html>
